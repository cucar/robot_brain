[package]
name = "ucar-napi"
version = "0.1.0"
edition = "2021"
description = "N-API bindings exposing ucar-core to Node.js"

[lib]
crate-type = ["cdylib"]

[dependencies]
ucar-core = { path = "../ucar-core" }
napi = { version = "2", features = ["full"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
